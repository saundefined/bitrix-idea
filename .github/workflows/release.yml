name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml
    secrets:
      FETCH_SUBMODULES_PAT: ${{ secrets.FETCH_SUBMODULES_PAT }}

  create-release:
    name: Create Release
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and get version
        id: tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          PROJECT_VERSION="$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')"

          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "Could not read version from gradle.properties" >&2
            exit 1
          fi

          if [[ "$TAG" != "$PROJECT_VERSION" && "$TAG" != "v$PROJECT_VERSION" ]]; then
            echo "Tag '$TAG' does not match gradle.properties version '$PROJECT_VERSION'" >&2
            exit 1
          fi

          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      # Артефакт плагина загружен без архивации, поэтому имя совпадает с именем ZIP-файла.
      - name: Download plugin artifact
        uses: actions/download-artifact@v8
        with:
          pattern: '*.zip'
          merge-multiple: true
          path: ./plugin

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove old release drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{} || true

      - name: Generate release notes
        run: |
          set -euo pipefail
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file=release_note.txt \
            || echo "Release notes for version ${{ steps.tag.outputs.version }}" > release_note.txt

          if [[ ! -s release_note.txt ]]; then
            echo "Release notes are empty; add entries under '## [Unreleased]' in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PLUGIN_ZIP="$(find ./plugin -name '*.zip' -print -quit)"

          if [[ -z "$PLUGIN_ZIP" ]]; then
            echo "Plugin ZIP was not produced by the build" >&2
            exit 1
          fi

          gh release create "${{ steps.tag.outputs.version }}" \
            --title "${{ steps.tag.outputs.version }}" \
            --notes-file release_note.txt \
            --verify-tag \
            "$PLUGIN_ZIP"

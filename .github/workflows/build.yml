name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platformVersion:
        description: IntelliJ Platform version (for example 2025.1.5)
        required: false
        default: 2025.2.6.2
      phpPluginVersion:
        description: PHP plugin build matching the platform
        required: false
        default: 252.28539.149
      psiTests:
        description: Run PSI tests (downloads tests-bootstrap)
        required: false
        type: boolean
        default: false
      verifyPlatforms:
        description: Comma-separated PhpStorm versions for the plugin verifier
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml
    with:
      platformVersion: ${{ inputs.platformVersion || '2025.2.6.2' }}
      phpPluginVersion: ${{ inputs.phpPluginVersion || '252.28539.149' }}
      psiTests: ${{ inputs.psiTests || false }}
      verifyPlatforms: ${{ inputs.verifyPlatforms || '' }}
    secrets:
      FETCH_SUBMODULES_PAT: ${{ secrets.FETCH_SUBMODULES_PAT }}
